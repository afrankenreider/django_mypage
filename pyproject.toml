[project]
name = "django-mypage"
version = "0.1.0"
description = "Andrew Frankenreider Portfolio - A modern personal portfolio website"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Andrew Frankenreider" }
]

dependencies = [
    "django==4.1.1",
    "django-bootstrap4==3.0.1",
    "django-filter==2.4.0",
    "django-import-export",
    "django-tables2==2.4.0",
    "djangorestframework==3.14.0",
    "django-cors-headers==4.3.0",
    "dj-database-url>=1.0,<2.0",
    "gunicorn==19.9.0",
    "pandas",
    "psycopg2-binary>=2.9.0",
    "python-dotenv==0.19.2",
    "tablib",
    "whitenoise==5.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-django",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-django",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["base_app", "my_webpage"]
