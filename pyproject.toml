[project]
name = "django-mypage"
version = "0.1.0"
description = "Andrew Frankenreider Portfolio - A modern personal portfolio website"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Andrew Frankenreider" }]

dependencies = [
    "django>=5.1",
    "django-bootstrap4>=24.4",
    "django-filter>=24.3",
    "django-import-export>=4.3",
    "django-tables2>=2.7",
    "djangorestframework>=3.15",
    "django-cors-headers>=4.6",
    "dj-database-url>=2.3",
    "gunicorn>=23.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "tablib>=3.7",
    "whitenoise>=6.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pre-commit>=4.0",
    "ruff>=0.8",
    "ipykernel>=6.29",
    "jupyter>=1.1",
    "notebook>=7.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pre-commit>=4.0",
    "ruff>=0.8",
    "ipykernel>=6.29",
    "jupyter>=1.1",
    "notebook>=7.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "src.apps.base_app.settings"
python_files = ["test_*.py", "*_test.py", "tests.py"]
testpaths = ["tests", "src/apps"]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "migrations",
    "node_modules",
    "frontend",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["src"]
