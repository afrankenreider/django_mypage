<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Declares both schemes before first paint. The script applies a stored override from the header toggle. -->
    <meta name="color-scheme" content="light dark" />
    <script>
        try {
            document.querySelector('meta[name="color-scheme"]').content = localStorage.getItem('color-scheme') ?? 'light dark';
        } catch (error) { /* Storage blocked: keep following the system preference. */ }
    </script>
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0c" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="Andrew Frankenreider is a data science and analytics manager at Caterpillar, Inc. Resume, skills, and interactive demos of regression, clustering, and neural networks." />
    <meta name="author" content="Andrew Frankenreider" />
    <title>Andrew Frankenreider</title>
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L9XR41T4TF"></script>
    <script>
        window.dataLayer = window.dataLayer || [];

        function gtag() {
            dataLayer.push(arguments);
        }
        gtag('js', new Date());
        gtag('config', 'G-L9XR41T4TF');
    </script>
</head>

    <div id="root"></div>

</body>

</html>
